<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkers (Droughts)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Checkers / Droughts</h1>
            <div id="status">Your Turn (Red)</div>
        </header>

        <div class="scoreboard">
            <div class="score red-score">Red (You): <span id="red-count">12</span></div>
            <div class="score white-score">White (AI): <span id="white-count">12</span></div>
        </div>

        <div class="board-wrapper">
            <div id="board" class="board"></div>
        </div>

        <div class="controls">
            <button id="sound-btn" class="control-btn">Sound: ON</button>
            <button id="restart-btn" class="control-btn">Restart Game</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
